main_source_params:
  ids: {$init_var: order_ids}
  field_keys:
    - order_id
    - order_date
    - quantity
    - unit_price
    - discount_rate
    - customer_id
    - product_id
    - warehouse_id
    - promotion_id
    - payment_method_id
    - logistics_id
    - region_id
    - product_category_id
