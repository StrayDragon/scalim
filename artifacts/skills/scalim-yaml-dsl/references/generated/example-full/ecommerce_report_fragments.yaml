# NOTE:
# This file is intended to be imported by `ecommerce_report.yaml` via `imports/$import`.
# Imports v2 resolves paths relative to the current YAML file's directory.

main_source_params:
  ids: {$init_var: order_ids}
  field_keys:
    - order_id
    - order_date
    - quantity
    - unit_price
    - discount_rate
    - customer_id
    - product_id
    - warehouse_id
    - promotion_id
    - payment_method_id
    - logistics_id
    - region_id
    - product_category_id

# ==============================================================================
# aggregate 示例片段(供 `ecommerce_report.yaml` 通过 `$import` 引用)
# ==============================================================================

agg_by_region_guardrails:
  group_by: [region_name_display]
  max_groups: 1000
  max_distinct: 10000
  distinct_on_overflow: truncate

metric_order_cnt:
  count: {}

metric_sum_order_amount:
  sum: {field: order_amount}
