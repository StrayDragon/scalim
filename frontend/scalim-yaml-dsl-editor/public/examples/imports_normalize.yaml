# yaml-language-server: $schema=../schema/demand.gen.json

name: imports_normalize_demo
description: 演示 imports/$import、runtime vars 指令节点、normalize.kind 写法

imports:
  common: ./common.yaml

main_source:
  source_id: orders
  loader: "myapp.loaders:load_orders"
  fields:
    order_id: {extract: order_id, name: 订单ID}
    user_id: {extract: user_id, name: 用户ID}

relations:
  orders_to_users:
    steps:
      - from: orders.user_id
        to: users.user_id

sources:
  # 将 ./common.yaml 中的 `sources:` 片段合并进来 (示意; editor 不会在浏览器侧解析导入文件)
  $import: common.sources

  users:
    loader: "myapp.loaders:load_users"
    key: user_id
    normalize:
      kind: index_by_key
      key_field: user_id
    params:
      user_ids_set: {$keys: {as: set}}
    fields:
      user_name: {extract: user_name, name: 用户名, relation: orders_to_users}

outputs:
  - name: detail
    container: {type: csv, path: ./output/imports_normalize_demo.csv}
    fields: [order_id, user_name]

