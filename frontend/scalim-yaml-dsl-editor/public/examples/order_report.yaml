# yaml-language-server: $schema=../schema/demand.gen.json

name: order_report
description: 订单报表 - 展示客户、支付、国家等关联信息

batch_size: 3

main_source:
  source_id: orders
  loader: "scalim_misc.example_report_ir:DAL.paged_get_order_list"
  params:
    begin_time: "2024-01-01"
    end_time: "2024-01-07"
  fields:
    # region 主键和基础字段

    order_id:
      extract: order_id
      name: 订单ID

    amount:
      extract: amount
      name: 金额

    cost:
      extract: cost
      name: 成本

    # endregion

    # region 外键字段

    customer_id:
      extract: customer_id
      name: 客户ID

    pay_id:
      extract: pay_id
      name: 支付ID

    order_type_id:
      extract: order_type_id
      name: 订单类型ID

    small_group_ids:
      extract: small_group_ids
      name: 小组ID列表

    # endregion

relations:
  # 单级关联
  orders_to_customers:
    steps:
      - from: orders.customer_id
        to: customers.customer_id

  orders_to_pays:
    steps:
      - from: orders.pay_id
        to: pays.pay_id

  orders_to_order_types:
    steps:
      - from: orders.order_type_id
        to: order_types.type_id

  # 多级关联: orders → pays → countries
  orders_to_countries:
    steps:
      - from: orders.pay_id
        to: pays.pay_id
      - from: pays.country_id
        to: countries.country_id

  # 单级关联 + CSV 多值字段
  orders_to_small_groups:
    steps:
      - from: orders.small_group_ids
        to: small_groups.small_group_id
        lookup_cast:
          name: sep_first
          sep: ","

  # 多级关联 + CSV 多值字段
  orders_to_big_groups:
    steps:
      - from: orders.small_group_ids
        to: small_groups.small_group_id
        lookup_cast:
          name: sep_first
          sep: ","
      - from: small_groups.big_group_id
        to: big_groups.big_group_id

sources:
  customers:
    loader: "scalim_misc.example_report_ir:BLL.get_customer_info_from_api_of_kw_params"
    key: customer_id
    params:
      customer_ids_set: {$keys: {as: set}}
    fields:
      customer_name:
        extract: customer_name
        name: 客户名称
        relation: orders_to_customers

  pays:
    loader: "scalim_misc.example_report_ir:BLL.get_pay_info_from_api_of_concrete_params"
    key: pay_id
    params:
      pay_ids_set: {$keys: {as: set}}
    fields:
      country_id:
        extract: country_id
        name: 国家ID
        relation: orders_to_pays

      pay_method:
        extract: pay_name
        name: 支付方式
        relation: orders_to_pays

  countries:
    loader: "scalim_misc.example_report_ir:DAL.get_country_info_of_concrete_params"
    key: country_id
    params:
      country_ids_set: {$keys: {as: set}}
    fields:
      country_name:
        extract: country_name
        name: 国家名称
        relation: orders_to_countries

  order_types:
    loader: "scalim_misc.example_report_ir:data_loader.get_order_types"
    key: type_id
    cache_mode: preload_forever
    fields:
      order_type_name:
        extract: type_name
        name: 订单类型
        relation: orders_to_order_types

  small_groups:
    loader: "scalim_misc.example_report_ir:data_loader.get_small_groups"
    key: small_group_id
    cache_mode: preload_forever
    fields:
      big_group_id:
        extract: big_group_id
        name: 大组ID
        relation: orders_to_small_groups

      small_group_name:
        extract: small_group_name
        name: 小组名称
        relation: orders_to_small_groups

  big_groups:
    loader: "scalim_misc.example_report_ir:data_loader.get_big_groups"
    key: big_group_id
    cache_mode: preload_forever
    lookup_cast: {name: int}
    fields:
      big_group_name:
        extract: big_group_name
        name: 大组名称
        relation: orders_to_big_groups

fields:
  # region 派生字段

  profit:
    name: 利润
    compute: "amount - cost"

  profit_margin:
    name: 利润率
    compute: "(amount - cost) / amount * 100 if amount > 0 else 0"

  # endregion

outputs:
  - name: detail
    container:
      type: csv
      path: ./.tmp/output/order_report.csv
      encoding: utf-8
      streaming: true
      include_header: true
      header_fields_output_by: name
    fields: [order_id, customer_name, amount, cost, profit, country_name]
