# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: detail_transactions
description: |
  交易明细 sheet — 对应 Pay Order 的订单明细 sheet。
  包含多类型数字字段及边界情况，验证 xlsx_file 路径的类型丢失。

main_source:
  source_id: txs
  loader: "loaders:load_transactions"
  fields:
    tx_id:      {name: "交易编号"}
    product:    {name: "产品"}
    amount:     {name: "下单金额"}
    rate:       {name: "汇率"}
    qty:        {name: "数量"}
    unit_price: {name: "单价"}
    active:     {name: "是否活跃"}
    discount:   {name: "折扣率"}
    status:     {name: "状态码"}

# 一些字段通过 call_by 使用 to_numeric 处理，模仿真实业务的防御性编程
# 注意：即使经过 to_numeric，xlsx_file 路径仍会 stringify
fields:
  std_amount:
    name: "标准化金额"
    call_by: "loaders:to_numeric(value=amount)"
  std_rate:
    name: "标准化汇率"
    call_by: "loaders:to_numeric(value=rate)"

outputs:
  - name: detail_sheet
    to:
      book: report_workbook
      sheet: 交易明细
    fields:
      - tx_id
      - product
      - std_amount
      - std_rate
      - qty
      - unit_price
      - active
      - discount
      - status

  - name: detail_sheet_sb
    to:
      book: report_sheetbook
      sheet: 交易明细
    fields:
      - tx_id
      - product
      - std_amount
      - std_rate
      - qty
      - unit_price
      - active
      - discount
      - status
