# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: channel_dimension
description: |
  渠道维度 sheet — 对应 Pay Order 的维度统计 sheet。
  按渠道聚合，产出指标类型为 float/int，验证聚合后数字在 xlsx_file 中仍丢失类型。

main_source:
  source_id: ch
  loader: "loaders:load_channel_summary"
  fields:
    channel:      {name: "渠道"}
    order_count:  {name: "订单数"}
    total_amount: {name: "总金额"}
    avg_amount:   {name: "平均金额"}
    active_rate:  {name: "活跃率"}
    share_pct:    {name: "占比"}
    total_qty:    {name: "总数量"}

outputs:
  - name: channel_sheet
    to:
      book: report_workbook
      sheet: 渠道维度
    fields:
      - channel
      - order_count
      - total_amount
      - avg_amount
      - active_rate
      - share_pct
      - total_qty

  - name: channel_sheet_sb
    to:
      book: report_sheetbook
      sheet: 渠道维度
    fields:
      - channel
      - order_count
      - total_amount
      - avg_amount
      - active_rate
      - share_pct
      - total_qty
