# yaml-language-server: $schema=../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: obs_demo_detail
description: |
  Synthetic detail demand: facts + dims + regions, derived compute/call_by,
  shared workbook sheet write + CSV side output.

main_source:
  source_id: facts
  loader: "obs_demo_pkg.loaders:load_facts"
  params:
    ids: {$init_var: fact_ids}
  order_by: [fact_id]
  fields:
    fact_id: {name: FactId}
    dim_id: {name: DimId}
    region_id: {name: RegionId}
    qty: {name: Qty}
    unit_price: {name: UnitPrice}

sources:
  dims:
    loader: "obs_demo_pkg.loaders:load_dims"
    key: dim_id
    params:
      keys: {$keys: {as: list}}
    fields:
      dim_code: {name: DimCode, extract: dim_code, relation: facts_to_dims}
      dim_weight: {name: DimWeight, extract: weight, relation: facts_to_dims}
      dim_region_id: {name: DimRegionId, extract: region_id, relation: facts_to_dims}

  regions:
    loader: "obs_demo_pkg.loaders:load_regions"
    key: region_id
    params:
      keys: {$keys: {as: list}}
    fields:
      region_code: {name: RegionCode, extract: region_code, relation: facts_to_regions}
      region_tier: {name: RegionTier, extract: tier, relation: facts_to_regions}

  preload_marker:
    loader: "obs_demo_pkg.loaders:load_preload_marker"
    key: id
    cache_mode: preload_forever

relations:
  facts_to_dims:
    steps:
      - from: facts.dim_id
        to: dims.dim_id

  facts_to_regions:
    steps:
      - from: facts.region_id
        to: regions.region_id

  # 2-hop: facts -> dims -> regions (uses field_id dim_region_id)
  facts_to_regions_via_dim:
    steps:
      - from: facts.dim_id
        to: dims.dim_id
      - from: dims.dim_region_id
        to: regions.region_id

fields:
  line_amount:
    name: LineAmount
    compute: "qty * unit_price"

  weighted_amount:
    name: WeightedAmount
    call_by: "obs_demo_pkg.loaders:amount_expr(qty=qty, unit_price=unit_price, weight=dim_weight)"

  region_name_display:
    name: RegionDisplay
    compute: "region_code"

  region_via_dim_code:
    name: RegionViaDim
    # pull via explicit 2-hop relation field binding on sources would be ambiguous;
    # expose dim_region_id for evidence that intermediate hop field exists
    compute: "dim_region_id"

resources:
  files:
    detail_csv:
      csv_file:
        path: ./out/detail_csv

outputs:
  - name: detail_sheet
    to:
      book: report
      sheet: Detail
    write:
      header_fields_output_by: field_id
      include_header: true
    fields:
      - fact_id
      - dim_code
      - region_code
      - region_tier
      - region_via_dim_code
      - qty
      - unit_price
      - line_amount
      - weighted_amount
      - region_name_display

  - name: detail_csv
    to:
      file: detail_csv
    write:
      header_fields_output_by: field_id
      include_header: true
    fields:
      - fact_id
      - dim_code
      - region_code
      - qty
      - line_amount
      - weighted_amount
