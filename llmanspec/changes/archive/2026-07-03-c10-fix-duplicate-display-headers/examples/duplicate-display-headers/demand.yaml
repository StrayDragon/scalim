# yaml-language-server: $schema=../../../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: duplicate_display_headers_demo
description: |
  MVP: 重复展示列名导出回归 demo(脱敏)。

  底层 field_id 全局唯一;展示名(name)可重复(多个「人数」/「金额」指标块)。
  验证 workflow 导出 xlsx/csv 时数据按 field_id 正确对齐,不被首列值填充。

main_source:
  source_id: metrics
  loader: "data_loader:load_metrics"
  fields:
    pay_count_first: {name: 人数}
    pay_amount_first: {name: 金额}
    pay_count_repeat: {name: 人数}
    pay_amount_repeat: {name: 金额}

resources:
  files:
    metrics_csv:
      csv_file:
        path: ./out/metrics_csv

outputs:
  # xlsx_file (workbook) 路径
  - name: detail_workbook
    to:
      book: report_workbook
      sheet: Detail
    write:
      header_fields_output_by: name
    fields: &dup_fields [pay_count_first, pay_amount_first, pay_count_repeat, pay_amount_repeat]

  # xlsx_memory (sheetbook) 路径(对照:本就不受影响)
  - name: detail_sheetbook
    to:
      book: report_sheetbook
      sheet: Detail
    write:
      header_fields_output_by: name
    fields: *dup_fields

  # csv (file) 路径
  - name: detail_csv
    to:
      file: metrics_csv
    write:
      header_fields_output_by: name
      include_header: true
    fields: *dup_fields
