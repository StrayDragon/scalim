# yaml-language-server: $schema=../../../../../../../src/scalim/dsl/yaml_dsl/schema/workflow.gen.json

workflow:
  resources:
    books:
      report_workbook:
        xlsx_file:
          path: ./out/report_workbook
          allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

      report_sheetbook:
        xlsx_memory:
          budget:
            max_sheets: 6
            max_total_cells: 100000
          export_xlsx:
            path: ./out/report_sheetbook
            allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

  runs:
    - id: metrics_run
      demand: demand.yaml
