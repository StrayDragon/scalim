# Shape-only MVP (not a runnable demand). See tests/yaml_dsl/test_c20_unified_xlsx_book_kind.py for executable isomorphic fixtures.
resources:
  books:
    scratch:
      xlsx: {}
    report:
      xlsx:
        path: ./out

main_source:
  loader: "scalim.workflow.loaders:book_sheet_rows"
  params:
    ref: {node: stage_a, book: scratch, sheet: metrics_a}

outputs:
