# Before（误解）：两个 book 都像「最终报表」，看不出 memory 的独立价值
# 虚构示例 — 勿当作外部业务模板里的真实资源名

workflow:
  resources:
    books:
      metrics:
        xlsx_memory: {}
      report:
        xlsx_file:
          path: ./out

  runs:
    - id: stage_a
      demand: ./stage_a.demand.yaml
    - id: stage_b
      demand: ./stage_b.demand.yaml
      depends_on: [stage_a]
    - id: summary
      demand: ./summary.demand.yaml
      depends_on: [stage_b]
