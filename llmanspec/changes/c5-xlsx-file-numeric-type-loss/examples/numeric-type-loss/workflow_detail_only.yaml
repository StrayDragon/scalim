# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/workflow.gen.json
#
# 场景 B (最小复现): 单 demand 单 sheet
# 仅交易明细一个 sheet，用于快速验证数字类型丢失问题。

workflow:
  resources:
    books:
      report_workbook:
        xlsx_file:
          path: ./out/report_workbook
          allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

      report_sheetbook:
        xlsx_memory:
          budget:
            max_sheets: 10
            max_total_cells: 200000
          export_xlsx:
            path: ./out/report_sheetbook
            allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

  runs:
    - id: detail
      demand: demand_a.yaml
