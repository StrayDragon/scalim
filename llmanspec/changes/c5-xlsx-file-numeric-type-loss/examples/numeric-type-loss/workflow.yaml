# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/workflow.gen.json
#
# 场景 A (主场景): 多 demand 写入同一 xlsx_file book 的多个 sheet
# 镜像 Pay Order 的"明细 + 多维度 sheet"模式
#
# 3 demands, 3 sheets, 同一 report_workbook (xlsx_file) 书
# 同时写入 report_sheetbook (xlsx_memory) 做对照

workflow:
  resources:
    books:
      # xlsx_file book —— 经过 CSV 中间层,所有数字类型会丢失
      report_workbook:
        xlsx_file:
          path: ./out/report_workbook
          allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

      # xlsx_memory book —— 保留数字类型（对照,不受影响）
      report_sheetbook:
        xlsx_memory:
          budget:
            max_sheets: 10
            max_total_cells: 200000
          export_xlsx:
            path: ./out/report_sheetbook
            allow_formulas: false
        write_defaults:
          mode: sheet
          on_conflict: overwrite

  runs:
    - id: detail
      demand: demand_a.yaml

    - id: channel
      demand: demand_b.yaml
      depends_on: [detail]

    - id: kpi
      demand: demand_c.yaml
      depends_on: [channel]
