version: 1

# Ordered rules: more-specific first.
# Keep repository rules narrow and deterministic to avoid accidental rewrites.
# Organization/project-private literals belong in `llmanspec/sanitize_rules.local.yaml`.
rules:
  # --- Doc examples: api_key / token values (avoid leaking real values) ---
  - name: example_api_key_value
    pattern: "(?m)^(\\s*api_key\\s*:\\s*)\"[^\"]*\"\\s*$"
    replace: "\\1\"API_KEY_PLACEHOLDER\""

  - name: example_cli_token_value
    pattern: "(?m)(\\s--token\\s+)(\\S+)"
    replace: "\\1TOKEN_PLACEHOLDER"

  - name: example_doc_token_inline
    pattern: "(?m)^(\\s*-\\s*token\\s*:\\s*)`[^`]+`\\s*$"
    replace: "\\1`TOKEN_PLACEHOLDER`"
