name: ecommerce_order_report
description: |
  Plan A MVP: sources-first + explicit refs + output.select

  目标: 不依赖 YAML anchors/alias 也能完成:
  - 主源 orders
  - lookup sources: customers/products
  - joins: orders->customers, orders->products
  - derived: order_amount/profit
  - output.select 选择字段并覆写显示名

batch_size: 100

sources:
  orders:
    main: true
    loader: "scalim_misc.demo_big_data_report.loaders:load_orders"
    params:
      ids: {$runtime: order_ids}
      field_keys: [order_id, order_date, quantity, unit_price, discount_rate, customer_id, product_id]
    order_by: [orders.order_id]
    fields:
      order_id: {name: 订单ID}
      order_date: {name: 订单日期}
      quantity: {name: 数量, value_cast: int}
      unit_price: {name: 单价}
      discount_rate: {name: 折扣率}
      customer_id: {name: 客户ID}
      product_id: {name: 产品ID}

  customers:
    loader: "scalim_misc.demo_big_data_report.loaders:load_customers"
    key: customer_id
    params:
      ids: {$keys: {as: list}}
    fields:
      customer_name: {name: 客户姓名, via: orders_to_customers}
      customer_level: {name: 会员等级, via: orders_to_customers}

  products:
    loader: "scalim_misc.demo_big_data_report.loaders:load_products"
    key: product_id
    lookup_cast: {name: int}
    params:
      ids: {$keys: {as: list}}
      field_keys: [product_id, product_name, product_cost]
    fields:
      product_name: {name: 产品名称, via: orders_to_products}
      product_cost: {name: 产品成本, via: orders_to_products}

joins:
  orders_to_customers:
    steps:
      - from: orders.customer_id
        to: customers.customer_id

  orders_to_products:
    steps:
      - from: orders.product_id
        to: products.product_id
        lookup_cast: {name: int}

derive:
  order_amount:
    name: 订单金额
    expr: "round(orders.quantity * orders.unit_price * orders.discount_rate, 2)"

  profit:
    name: 利润
    call:
      ref: "scalim_misc.demo_big_data_report.loaders:calc_profit"
      kwargs:
        order_amount: order_amount
        product_cost: products.product_cost
        quantity: orders.quantity

output:
  format: csv
  path: ./.tmp/output/plan_a_ecommerce_report.csv
  streaming: true
  include_header: true
  header_fields_output_by: name
  select:
    - orders.order_id
    - orders.order_date
    - ref: orders.quantity
      name: 数量(输出覆写)
    - orders.unit_price
    - orders.discount_rate
    - customers.customer_name
    - ref: customers.customer_level
      name: 会员等级(输出覆写)
    - products.product_name
    - products.product_cost
    - order_amount
    - profit

observability:
  performance:
    enabled: true
    metrics: [duration, memory]
    sampling_interval: 2
    report:
      format: csv
      output: ./.tmp/output/plan_a_perf_report.csv
      include_details: true
