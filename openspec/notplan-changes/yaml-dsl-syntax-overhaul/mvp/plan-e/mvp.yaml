name: ecommerce_order_report
description: |
  Plan E MVP: current DSL shape + string refs + output.fields sugar + derive rename

batch_size: 100

main_source:
  source_id: orders
  loader: "scalim_misc.demo_big_data_report.loaders:load_orders"
  params:
    ids: {$runtime: order_ids}
    field_keys: [order_id, order_date, quantity, unit_price, discount_rate, customer_id, product_id]
  order_by: [order_id]
  fields:
    order_id: {name: 订单ID}
    order_date: {name: 订单日期}
    quantity: {name: 数量, value_cast: int}
    unit_price: {name: 单价}
    discount_rate: {name: 折扣率}
    customer_id: {name: 客户ID}
    product_id: {name: 产品ID}

relations:
  orders_to_customers:
    steps:
      - from: orders.customer_id
        to: customers.customer_id

  orders_to_products:
    steps:
      - from: orders.product_id
        to: products.product_id
        lookup_cast: {name: int}

sources:
  customers:
    loader: "scalim_misc.demo_big_data_report.loaders:load_customers"
    key: customer_id
    params:
      ids: {$keys: {as: list}}
    fields:
      customer_name:
        name: 客户姓名
        relation: orders_to_customers
      customer_level:
        name: 会员等级
        relation: orders_to_customers

  products:
    loader: "scalim_misc.demo_big_data_report.loaders:load_products"
    key: product_id
    lookup_cast: {name: int}
    params:
      ids: {$keys: {as: list}}
      field_keys: [product_id, product_name, product_cost]
    fields:
      product_name:
        name: 产品名称
        relation: orders_to_products
      product_cost:
        name: 产品成本
        relation: orders_to_products

derive:
  order_amount:
    name: 订单金额
    compute: "round(quantity * unit_price * discount_rate, 2)"

  profit:
    name: 利润
    call_by: "scalim_misc.demo_big_data_report.loaders:calc_profit(order_amount=order_amount, product_cost=product_cost, quantity=quantity)"

output:
  format: csv
  path: ./.tmp/output/plan_e_ecommerce_report.csv
  streaming: true
  include_header: true
  header_fields_output_by: name
  fields:
    # string sugar: field_id
    - order_id
    - order_date
    - quantity
    - unit_price
    - discount_rate

    # string sugar: source.field_id disambiguation
    - customers.customer_name
    - customers.customer_level
    - products.product_name
    - products.product_cost

    - order_amount
    - profit
