name: ecommerce_order_report
description: |
  Plan D MVP: explicit ids + arrays

sources:
  - id: orders
    main: true
    loader: "notebooks.marimo.demo_big_data_report._loaders:load_orders"
    params:
      ids: {$runtime: order_ids}
      field_keys: [order_id, order_date, quantity, unit_price, discount_rate, customer_id, product_id]
    order_by: [order_id]
    fields:
      - id: order_id
        name: 订单ID
      - id: order_date
        name: 订单日期
      - id: quantity
        name: 数量
        value_cast: int
      - id: unit_price
        name: 单价
      - id: discount_rate
        name: 折扣率
      - id: customer_id
        name: 客户ID
      - id: product_id
        name: 产品ID

  - id: customers
    loader: "notebooks.marimo.demo_big_data_report._loaders:load_customers"
    key: customer_id
    params:
      ids: {$keys: {as: list}}
    fields:
      - id: customer_name
        name: 客户姓名
        via: orders_to_customers
      - id: customer_level
        name: 会员等级
        via: orders_to_customers

  - id: products
    loader: "notebooks.marimo.demo_big_data_report._loaders:load_products"
    key: product_id
    lookup_cast: {name: int}
    params:
      ids: {$keys: {as: list}}
      field_keys: [product_id, product_name, product_cost]
    fields:
      - id: product_name
        name: 产品名称
        via: orders_to_products
      - id: product_cost
        name: 产品成本
        via: orders_to_products

joins:
  - id: orders_to_customers
    steps:
      - from: orders.customer_id
        to: customers.customer_id

  - id: orders_to_products
    steps:
      - from: orders.product_id
        to: products.product_id
        lookup_cast: {name: int}

derive:
  - id: order_amount
    name: 订单金额
    expr: "round(orders.quantity * orders.unit_price * orders.discount_rate, 2)"

  - id: profit
    name: 利润
    call:
      ref: "notebooks.marimo.demo_big_data_report._loaders:calc_profit"
      kwargs:
        order_amount: order_amount
        product_cost: products.product_cost
        quantity: orders.quantity

output:
  format: csv
  path: ./.tmp/output/plan_d_ecommerce_report.csv
  streaming: true
  select:
    - ref: orders.order_id
    - ref: orders.order_date
    - ref: customers.customer_name
    - ref: products.product_name
    - ref: order_amount
    - ref: profit
