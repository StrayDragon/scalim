template:
  name: ecommerce_order_report
  description: |
    Plan F MVP: template + run split

  batch_size: 100

  sources:
    orders:
      main: true
      loader: "notebooks.marimo.examples.demo_big_data_report._loaders:load_orders"
      params:
        # template 部分只声明“需要哪些变量”,不内联 $runtime.*
        ids: {$var: order_ids}
        field_keys: [order_id, order_date, quantity, unit_price, discount_rate, customer_id, product_id]
      order_by: [orders.order_id]
      fields:
        order_id: {name: 订单ID}
        order_date: {name: 订单日期}
        quantity: {name: 数量, value_cast: int}
        unit_price: {name: 单价}
        discount_rate: {name: 折扣率}
        customer_id: {name: 客户ID}
        product_id: {name: 产品ID}

    customers:
      loader: "notebooks.marimo.examples.demo_big_data_report._loaders:load_customers"
      key: customer_id
      params:
        ids: {$keys: {as: list}}
      fields:
        customer_name: {name: 客户姓名, via: orders_to_customers}
        customer_level: {name: 会员等级, via: orders_to_customers}

    products:
      loader: "notebooks.marimo.examples.demo_big_data_report._loaders:load_products"
      key: product_id
      lookup_cast: {name: int}
      params:
        ids: {$keys: {as: list}}
        field_keys: [product_id, product_name, product_cost]
      fields:
        product_name: {name: 产品名称, via: orders_to_products}
        product_cost: {name: 产品成本, via: orders_to_products}

  joins:
    orders_to_customers:
      steps:
        - from: orders.customer_id
          to: customers.customer_id

    orders_to_products:
      steps:
        - from: orders.product_id
          to: products.product_id
          lookup_cast: {name: int}

  derive:
    order_amount:
      name: 订单金额
      expr: "round(orders.quantity * orders.unit_price * orders.discount_rate, 2)"

  output:
    format: csv
    streaming: true
    include_header: true
    header_fields_output_by: name
    select:
      - orders.order_id
      - orders.order_date
      - orders.quantity
      - customers.customer_name
      - products.product_name
      - order_amount

run:
  vars:
    order_ids: [] # empty means "load all" for this demo loader

  output:
    path: ./.tmp/output/plan_f_ecommerce_report.csv

  observability:
    performance:
      enabled: true
      metrics: [duration]
      sampling_interval: 2

