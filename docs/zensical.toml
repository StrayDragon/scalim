[project]
site_name = "Scalim Docs"
docs_dir = "doc"
site_dir = "site"
plugins = ["search"]
extra_javascript = [
  "https://unpkg.com/mermaid@11.12.3/dist/mermaid.min.js",
  "assets/javascripts/mermaid-init.js",
  "assets/javascripts/code-links.js",
]
nav = [
  { "首页" = "index.md" },
  { "从这里开始" = [
    "getting-started/index.md",
    { "主线教程: demo_big_data_report" = "getting-started/demo-big-data-report.md" },
    { "公共 API 导入指南" = "getting-started/public-api.gen.md" },
  ] },
  { "DSL" = [
    { "YAML-DSL" = [
      "yaml-dsl/index.md",
      { "YAML 语法速查" = "yaml-dsl/syntax.md" },
      { "YAML 用户指南" = "yaml-dsl/user-guide.md" },
      { "YAML→IR 能力矩阵" = "yaml-dsl/capability-matrix.md" },
      { "YAML DSL 升级指南" = "yaml-dsl/upgrades/index.md" },
      { "配置补全与编辑体验" = "yaml-dsl/editor.md" },
      { "YAML DSL LSP/IDE 集成" = [
        "yaml-dsl/lsp/index.md",
        { "JetBrains" = "yaml-dsl/lsp/jetbrains.md" },
        { "Troubleshooting" = "yaml-dsl/lsp/troubleshooting.md" },
      ] },
      { "集成AI环境 (Agent Skill)" = "yaml-dsl/agent-skill.md" },
    ] },
  ] },
  { "运行与调参" = [
    { "并行模式(seq/adaptive)" = "architecture/parallel-modes.md" },
  ] },
  { "工具与排查" = [
    "tools/index.md",
    { "可视化工具(Scalim Viz)" = "viz/scalim-viz.md" },
    { "基准测试" = "benchmark/index.md" },
    { "指南" = "benchmark/guide.md" },
    { "对比报告" = "benchmark/compare-report.md" },
  ] },
  { "进阶阅读" = [
    "architecture/index.md",
    { "架构详解" = "architecture/arch.md" },
    { "OpenSpec 规范" = "specs/index.md" },
    { "OpenSpec 索引(生成)" = "specs/openspec-index.gen.md" },
  ] },
  { "参与开发" = [
    "dev/index.md",
    { "Prompt 评测(workflow)" = "dev/prompt-eval.md" },
    { "Prompt 评测(Coding agent / T1)" = "dev/prompt-eval-agent.md" },
    { "仓库开发约定" = "dev/repo-guide.md" },
    { "文档治理" = "dev/doc-governance.md" },
    { "SSOT/生成物地图" = "dev/ssot-map.md" },
    { "如何阅读本项目" = "getting-started/reading-guide.md" },
    { "Schema Meta 参考" = "yaml-dsl/schema-meta.md" },
  ] },
]
markdown_extensions = [
  "admonition",
  "tables",
  { "pymdownx.details" = {} },
  { "pymdownx.highlight" = {} },
  { "pymdownx.inlinehilite" = {} },
  { "pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "language-mermaid" }] } },
  { "toc" = { permalink = true } },
]

[project.theme]
language = "zh"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.indexes",
  "content.code.copy",
]
