# yaml-language-server: $schema=../../../../../../src/scalim/dsl/by_yaml/schema/demand.gen.json

name: demo_big_data_report_support_observability_full
description: |
  客服报表: 可观测性全家桶示例(为工程同学定位“慢/缺/错/飙内存”准备).

  目标:
  - YAML 只承载业务建模;可观测性通过 runtime entrypoints 装配
    - `components=[LoggingObserver(), ExecutionTraceObserver(), MemoryOptimizationObserver(...)]`
    - `overrides=RunOverrides(viz_config=VizObserverConfig(...))`

# NOTE: `batch_size` moved out of YAML runtime policy boundary.
# Pass via runtime entrypoints, e.g. `compile(..., batch_size=2)`.

main_source:
  source_id: tickets
  loader: "scalim_misc.demo_big_data_report.by_yaml_dsl.support_scenario:load_support_tickets"
  fields:
    ticket_id: {extract: ticket_id, name: 工单ID}
    priority: {extract: priority, name: 优先级}
    resolve_minutes: {extract: resolve_minutes, name: 解决耗时(分钟)}

resources:
  files:
    detail_csv:
      kind: csv_file
      path: {$init_var: out_path_detail}

outputs:
  - name: detail
    to: {file: detail_csv}
    write:
      header_fields_output_by: field_id
      include_header: true
    fields: [ticket_id, priority, resolve_minutes]
