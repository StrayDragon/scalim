# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: demo_big_data_report_support_output_failure_primary_only_full
description: |
  客服报表: “主输出必须成功,其它输出失败不阻断”(primary_only) + 错误信息包含全文(通过 runtime `demand_diagnostics`).

  典型场景:
  - 内部 CI/集成环境: 我们希望把完整错误信息留在 meta/audit/统计中,方便快速定位
  - 生产环境: 通常保持默认脱敏,避免敏感信息落盘

# NOTE: demand `failure_policy` moved out of YAML runtime policy boundary.
# Pass via runtime entrypoints, e.g. `run(..., demand_failure_policy="primary_only")`.
imports:
  frag: ../_shared/support_output_failure_fragments.yaml

main_source:
  $import: frag.base_main.main_source

resources:
  $import: frag.base_resources.resources

outputs:
  - name: detail
    to: {file: detail_csv}
    write:
      header_fields_output_by: field_id
      include_header: true
    fields: [ticket_id, priority, resolve_minutes]

  # 故意作为“非主输出”来演示 `failure_policy` + `demand_diagnostics.include_full_error_message`.
  # NOTE: 本章的 marimo notebook 会通过“在输出文件路径上预先创建同名目录”的方式,构造一个确定性的 workbook 写失败.
  - name: secondary_debug_workbook
    to:
      book: secondary_debug
      sheet: Debug
    fields: [ticket_id, priority, resolve_minutes]
