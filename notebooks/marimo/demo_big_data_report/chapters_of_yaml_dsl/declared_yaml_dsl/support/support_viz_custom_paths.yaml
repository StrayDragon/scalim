# yaml-language-server: $schema=../../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json

name: support_viz_custom_paths
description: |
  背景(假设): 工程同学希望把 `viz` 产物写到“固定位置”,以便：
  - CI artifact 采集(无需猜 run 目录)
  - 与其他系统集成(例如: 把 `viz_snapshot.json` / `viz_events.jsonl` 上传到对象存储)

  需求方提问:
  - 我能不能显式指定 `viz` 的 `output_path` / `snapshot_path`,避免默认的 run 目录规则？

  方案:
  - 用 runtime entrypoints 的 typed overrides:
    - `overrides=RunOverrides(viz_config=VizObserverConfig(output_path=..., snapshot_path=..., trace_enabled=True, ...))`

  对拍(oracle):
  - 断言: 三个文件都存在,且快照里包含 `meta.viz.run_name/env/payload_policy/...` 等元信息

# NOTE: `batch_size` moved out of YAML runtime policy boundary.
# Pass via runtime entrypoints, e.g. `compile(..., batch_size=2)`.

main_source:
  source_id: tickets
  loader: "scalim_misc.demo_big_data_report.by_yaml_dsl.support_scenario:load_support_tickets"
  fields:
    ticket_id: {extract: ticket_id, name: 工单ID}
    priority: {extract: priority, name: 优先级}
    resolve_minutes: {extract: resolve_minutes, name: 解决耗时(分钟)}

resources:
  files:
    detail_csv:
      csv_file:
        path: {$init_var: out_path_detail}
        encoding: utf-8

outputs:
  - name: detail
    to: {file: detail_csv}
    write:
      header_fields_output_by: field_id
      include_header: true
    fields: [ticket_id, priority, resolve_minutes]
