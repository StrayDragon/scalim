# yaml-language-server: $schema=../../../../../../src/scalim/dsl/by_yaml/schema/demand.gen.json

name: support_viz_custom_paths
description: |
  背景(假设): 工程同学希望把 `viz` 产物写到“固定位置”,以便：
  - CI artifact 采集(无需猜 run 目录)
  - 与其他系统集成(例如: 把 `viz_snapshot.json` / `viz_events.jsonl` 上传到对象存储)

  需求方提问:
  - 我能不能在 YAML 里显式指定 `viz` 的 `output_path` / `snapshot_path`,避免默认的 run 目录规则？

  方案:
  - 用 `template_vars` 在编译期注入三个显式路径:
    - `output_path`: 事件文件(`*.jsonl`)
    - `snapshot_path`: 快照文件(`*.json`)
    - trace 文件路径由运行期根据 `output_path/snapshot_path` 推导(同目录下 `viz_trace.jsonl`)

  对拍(oracle):
  - 断言: 三个文件都存在,且快照里包含 `meta.viz.run_name/env/payload_policy/...` 等元信息

batch_size: 2

main_source:
  source_id: tickets
  loader: "scalim_misc.demo_big_data_report.by_yaml_dsl.support_scenario:load_support_tickets"
  fields:
    ticket_id: {extract: ticket_id, name: 工单ID}
    priority: {extract: priority, name: 优先级}
    resolve_minutes: {extract: resolve_minutes, name: 解决耗时(分钟)}

resources:
  files:
    detail_csv:
      kind: csv_file
      path: {$init_var: out_path_detail}
      encoding: utf-8

outputs:
  - name: detail
    to: {file: detail_csv}
    write:
      header_fields_output_by: field_id
      include_header: true
    fields: [ticket_id, priority, resolve_minutes]

observability:
  viz:
    enabled: true
    output_path: "{{ viz_events_path }}"
    snapshot_path: "{{ viz_snapshot_path }}"
    trace_enabled: true
    payload_policy: sample
    sample_size: 2
    append: false
    run_name: support-viz-custom-paths
    env: ci
