# yaml-language-server: $schema=../../../../../../src/scalim/dsl/by_yaml/schema/demand.gen.json

name: demo_big_data_report_support_output_failure_primary_only_redacted
description: |
  客服报表: “主输出必须成功,其它输出失败不阻断”(primary_only) + 错误信息默认脱敏.

  场景:
  - 主输出: detail CSV (给业务/运营同学看)
  - 次输出: debug workbook (给工程同学排查)

  诉求:
  - debug workbook 偶尔写失败时,主输出依然要落盘
  - 默认不要把完整错误信息写到产物中(可能包含敏感路径/参数)

# NOTE: demand `failure_policy` moved out of YAML runtime policy boundary.
# Pass via runtime entrypoints, e.g. `run(..., demand_failure_policy="primary_only")`.
imports:
  frag: ../_shared/support_output_failure_fragments.yaml

main_source:
  $import: frag.base_main.main_source

resources:
  $import: frag.base_resources.resources

outputs:
  - name: detail
    to: {file: detail_csv}
    write:
      header_fields_output_by: field_id
      include_header: true
    fields: [ticket_id, priority, resolve_minutes]

  # 故意作为“非主输出”来演示 `failure_policy` + `demand_diagnostics.include_full_error_message`.
  # 运行时,我们会把 `out_path_secondary_workbook` 传成一个 *目录* 来触发可预期失败.
  - name: secondary_debug_workbook
    to:
      book: secondary_debug
      sheet: Debug
    fields: [ticket_id, priority, resolve_minutes]
