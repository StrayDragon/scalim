# yaml-language-server: $schema=../../../../../src/scalim/dsl/yaml_dsl/schema/workflow.gen.json

workflow:
  resources:
    books:
      report:
        kind: xlsx_memory
        budget:
          max_sheets: 8
          max_total_cells: 200000
        export_xlsx:
          path: ./report.xlsx
          write_lock: true
        write_defaults:
          mode: sheet
          on_conflict: overwrite

  runs:
    - id: detail
      demand: workflow_demo_big_data_report_detail_demand.yaml

    - id: metrics
      demand: workflow_demo_big_data_report_metrics_demand.yaml
      depends_on: [detail]

  options:
    max_concurrency: 2
    failure_policy: all_fail
    ctx:
      max_value_bytes: 65536
      max_bytes: 1048576
    cache_pool:
      conflict_policy: error
      release_policy: dag_refcount
      budget:
        max_entries: 16
        over_budget_policy: fail_fast
