# yaml-language-server: $schema=../../../../../src/scalim/dsl/by_yaml/schema/workflow.gen.json

workflow:
  runs:
    - id: r1
      demand: workflow_fixture_demand.yaml
    - id: r2
      demand: workflow_fixture_demand.yaml
  options:
    max_concurrency: 2
    failure_policy: all_fail
    # <!-- BEGIN AUTOGEN:workflow.options.cache_pool -->
    cache_pool:
      conflict_policy: error
      release_policy: dag_refcount
      budget:
        max_entries: 16
        over_budget_policy: fail_fast
      pin:
        - kind: preload_forever
          source_id: preload_counter
    # <!-- END AUTOGEN:workflow.options.cache_pool -->
