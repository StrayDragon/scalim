# yaml-language-server: $schema=../../../../../src/scalim/dsl/by_yaml/schema/demand.gen.json
# region SCALIM-SKILL:example-full:yaml

name: ecommerce_order_report
description: |
  电商订单报表 - YAML DSL 配置

  关联类型:
  - 单级关联: 订单 -> 客户、产品、促销、支付、物流
  - 多级关联: 订单 -> 产品 -> 分类 (2级)
  - 多级关联: 订单 -> 仓库 -> 区域 (2级)
  - 复合键关联: 订单 -> 区域定价 (region_id, product_category_id)
  - 派生字段: 订单金额、利润、最终价格

# ==============================================================================
# 跨文件复用示例 (imports/$import)
# ==============================================================================

imports:
  fragments: ecommerce_report_fragments.yaml

# ==============================================================================
# 模板/别名示例 (YAML anchors)
# ==============================================================================

_templates:
  detail_fields: &detail_fields
    - order_id
    - order_date
    - quantity
    - unit_price
    - discount_rate
    - customer_name
    - customer_phone
    - registration_date
    - customer_level
    - customer_name_rows_cached
    - customer_level_rows_cached
    - customer_name_rows_nocache
    - customer_level_rows_nocache
    - rows_name_match
    - rows_level_match
    - product_name
    - product_brand
    - product_cost
    - product_category_id
    - category_name
    - warehouse_name
    - region_name_value
    - region_name_display
    - region_manager
    - promotion_name
    - promotion_discount
    - no_promotion
    - payment_method_name
    - payment_fee_rate_candidates
    - logistics_name
    - logistics_speed
    - price_adjustment
    - shipping_fee
    - tax_rate
    - order_amount
    - profit
    - tax_amount
    - final_price

  # aggregate 片段复用示例: outputs 不支持 `$import`(imports scope boundary),使用 YAML anchors/merge 复用.
  agg_by_region_guardrails: &agg_by_region_guardrails
    group_by: [region_name_display]
    max_groups: 1000
    max_distinct: 10000
    distinct_on_overflow: truncate

  metric_order_cnt: &metric_order_cnt {count: {}}
  metric_sum_order_amount: &metric_sum_order_amount {sum: {field: order_amount}}

  # 关系步骤模板: 复用/merge 展示
  step_orders_to_customers: &step_orders_to_customers
    from: orders.customer_id
    to: customers.customer_id

  step_orders_to_products: &step_orders_to_products
    from: orders.product_id
    to: products.product_id

  step_orders_to_products_cast: &step_orders_to_products_cast
    <<: *step_orders_to_products
    lookup_cast:
      name: int

  perf_metrics_all: &perf_metrics_all [duration, memory, cpu]

# ==============================================================================
# 主数据源
# ==============================================================================

main_source:
  source_id: orders
  loader: "scalim_misc.demo_big_data_report.loaders:load_orders"
  params:
    # init_vars 注入示例: 由调用方传入 `init_vars={"order_ids": [...]}`.
    # 为空列表时 loader 仍会读取全量订单(见 `load_orders` 实现),用于保证 canonical demo 可直接运行.
    $import: fragments.main_source_params
  order_by:
    - order_id
  fields:
    # 主键
    order_id: &order_id
      name: 订单ID

    # 基础字段
    quantity: &quantity
      name: 数量
      value_cast: int

    unit_price: &unit_price
      name: 单价

    discount_rate: &discount_rate
      name: 折扣率

    order_date: &order_date
      name: 订单日期

    # 外键/关联 key 字段 (relation.steps 引用必须声明)
    customer_id:
      name: 客户ID

    product_id:
      name: 产品ID

    warehouse_id:
      name: 仓库ID

    promotion_id:
      name: 促销ID

    payment_method_id:
      name: 支付方式ID

    logistics_id:
      name: 物流ID

    region_id:
      name: 区域ID

    product_category_id:
      name: 产品分类ID

# ==============================================================================
# 关联定义
# ==============================================================================

relations:
  # 单级关联
  orders_to_customers: &orders_to_customers
    steps:
      - *step_orders_to_customers

  # rows 模式关联(默认复用/显式禁用对拍)
  orders_to_customers_rows_cache: &orders_to_customers_rows_cache
    steps:
      - from: orders.customer_id
        to: customers_rows_cached.customer_id

  orders_to_customers_rows_nocache: &orders_to_customers_rows_nocache
    steps:
      - from: orders.customer_id
        to: customers_rows_nocache.customer_id

  orders_to_products: &orders_to_products
    steps:
      - *step_orders_to_products_cast

  orders_to_warehouses: &orders_to_warehouses
    steps:
      - from: orders.warehouse_id
        to: warehouses.warehouse_id

  orders_to_promotions: &orders_to_promotions
    steps:
      - from: orders.promotion_id
        to: promotions.promotion_id

  orders_to_payment_methods: &orders_to_payment_methods
    steps:
      - from: orders.payment_method_id
        to: payment_methods.payment_method_id

  orders_to_payment_methods_candidates: &orders_to_payment_methods_candidates
    steps:
      - from: orders.payment_method_id
        to: payment_methods_candidates.payment_method_id

  orders_to_logistics: &orders_to_logistics
    steps:
      - from: orders.logistics_id
        to: logistics.logistics_id

  # 多级关联
  orders_to_categories: &orders_to_categories
    steps:
      - *step_orders_to_products
      - from: products.category_id
        to: categories.category_id

  orders_to_regions: &orders_to_regions
    steps:
      - from: orders.warehouse_id
        to: warehouses.warehouse_id
      - from: warehouses.warehouse_region_id
        to: regions.region_id

  # 复合键关联
  orders_to_region_pricing: &orders_to_region_pricing
    steps:
      - from: [orders.region_id, orders.product_category_id]
        to: [region_pricing.region_id, region_pricing.product_category_id]
        lookup_cast:
          name: int

# ==============================================================================
# 数据源定义
# ==============================================================================

sources:
  customers:
    loader: "scalim_misc.demo_big_data_report.loaders:load_customers"
    key: customer_id
    lookup_chunk_size: 5
    params:
      ids: {$keys: {as: list}}
    fields:
      # 单级关联 - 客户
      customer_name: &customer_name
        name: 客户姓名
        relation: orders_to_customers

      customer_level: &customer_level
        name: 会员等级
        relation: orders_to_customers

      customer_phone: &customer_phone
        name: 客户电话
        relation: orders_to_customers

      registration_date: &registration_date
        name: 注册日期
        relation: orders_to_customers

  customers_rows_cached:
    loader: "scalim_misc.demo_big_data_report.loaders:load_customers_by_rows"
    key: customer_id
    params:
      rows: {$rows: {cache_mode: batch}}
    fields:
      # rows 模式对拍字段
      customer_name_rows_cached: &customer_name_rows_cached
        name: 客户姓名(rows缓存)
        relation: orders_to_customers_rows_cache

      customer_level_rows_cached: &customer_level_rows_cached
        name: 会员等级(rows缓存)
        relation: orders_to_customers_rows_cache

  customers_rows_nocache:
    loader: "scalim_misc.demo_big_data_report.loaders:load_customers_by_rows"
    key: customer_id
    params:
      rows: {$rows: {cache_mode: none}}
    fields:
      customer_name_rows_nocache: &customer_name_rows_nocache
        name: 客户姓名(rows不缓存)
        relation: orders_to_customers_rows_nocache

      customer_level_rows_nocache: &customer_level_rows_nocache
        name: 会员等级(rows不缓存)
        relation: orders_to_customers_rows_nocache

  products:
    loader: "scalim_misc.demo_big_data_report.loaders:load_products"
    key: product_id
    lookup_cast:
      name: int
    params:
      ids: {$keys: {as: list}}
      field_keys:
        - product_id
        - product_name
        - product_brand
        - product_cost
        - category_id
    fields:
      # 单级关联 - 产品
      product_name: &product_name
        name: 产品名称
        relation: orders_to_products

      product_brand: &product_brand
        name: 产品品牌
        relation: orders_to_products

      product_cost: &product_cost
        name: 产品成本
        relation: orders_to_products
      category_id: &category_id
        name: 产品分类ID(lookup)
        relation: orders_to_products

  categories:
    loader: "scalim_misc.demo_big_data_report.loaders:load_categories"
    key: category_id
    params:
      ids: {$keys: {as: set}}
    fields:
      # 多级关联 - 分类
      category_name: &category_name
        name: 产品分类
        relation: orders_to_categories

  warehouses:
    loader: "scalim_misc.demo_big_data_report.loaders:load_warehouses"
    key: warehouse_id
    params:
      ids: {$keys: {as: set}}
    fields:
      warehouse_region_id:
        name: 区域ID(lookup)
        extract: region_id
        relation: orders_to_warehouses

      # 多级关联 - 仓库
      warehouse_name: &warehouse_name
        name: 仓库名称
        relation: orders_to_warehouses

  regions:
    loader: "scalim_misc.demo_big_data_report.loaders:load_regions"
    key: region_id
    params:
      ids: {$keys: {as: set}}
    fields:
      # 多级关联 - 区域
      region_name_value: &region_name_value
        name: 区域名称
        extract: region_name
        relation: orders_to_regions

      # 复用同一 field 值: 通过不同字段名/展示名表达不同语义
      region_name_display: &region_name_display
        name: 区域名称(展示)
        extract: region_name
        relation: orders_to_regions

      region_manager: &region_manager
        name: 区域经理
        relation: orders_to_regions

  region_pricing:
    loader: "scalim_misc.demo_big_data_report.loaders:load_region_pricing"
    key: [region_id, product_category_id]
    cache_mode: preload_forever
    fields:
      # 复合键关联 - 区域定价
      price_adjustment: &price_adjustment
        name: 价格调整系数
        relation: orders_to_region_pricing

      shipping_fee: &shipping_fee
        name: 运费
        relation: orders_to_region_pricing

      tax_rate: &tax_rate
        name: 税率
        relation: orders_to_region_pricing

  promotions:
    loader: "scalim_misc.demo_big_data_report.loaders:load_promotions"
    key: promotion_id
    cache_mode: preload_forever
    params:
      field_keys:
        - promotion_id
        - promotion_name
        - promotion_discount
    fields:
      # 单级关联 - 促销 (可能为空)
      promotion_name: &promotion_name
        name: 促销名称
        relation:
          steps:
            - from: orders.promotion_id
              to: promotions.promotion_id

      promotion_discount: &promotion_discount
        name: 促销折扣
        relation: orders_to_promotions

  payment_methods:
    loader: "scalim_misc.demo_big_data_report.loaders:load_payment_methods"
    key: payment_method_id
    cache_mode: preload_forever
    normalize:
      kind: index_by_key
      key_field: payment_method_id
      on_conflict: error
    fields:
      # 单级关联 - 支付方式
      payment_method_name: &payment_method_name
        name: 支付方式
        relation: orders_to_payment_methods

  payment_methods_candidates:
    loader: "scalim_misc.demo_big_data_report.loaders:load_payment_methods_candidates"
    key: payment_method_id
    cache_mode: preload_forever
    normalize:
      kind: map_values
      steps:
        - kind: take_first
          on_empty: miss
        - kind: project_fields
          on_missing: error
          fields:
            payment_method_id: {from_key: true}
            payment_fee_rate: {extract: payment_fee_rate}
    fields:
      payment_fee_rate_candidates: &payment_fee_rate_candidates
        name: 手续费率(候选取首条)
        extract: payment_fee_rate
        relation: orders_to_payment_methods_candidates

  logistics:
    loader: "scalim_misc.demo_big_data_report.loaders:load_logistics"
    key: logistics_id
    cache_mode: preload_forever
    fields:
      # 单级关联 - 物流
      logistics_name: &logistics_name
        name: 物流公司
        relation: orders_to_logistics

      logistics_speed: &logistics_speed
        name: 配送时效
        relation: orders_to_logistics

# ==============================================================================
# 派生字段定义
# ==============================================================================
fields:
  # 派生字段
  order_amount: &order_amount
    name: 订单金额
    compute: "round(quantity * unit_price * discount_rate, 2)"

  profit: &profit
    name: 利润
    call_by: "scalim_misc.demo_big_data_report.loaders:calc_profit(order_amount=order_amount, product_cost=product_cost, quantity=quantity)"

  tax_amount: &tax_amount
    name: 税费
    compute: "round(order_amount * tax_rate, 2)"

  final_price: &final_price
    name: 最终价格
    call_by: "scalim_misc.demo_big_data_report.loaders:calc_final_price(order_amount=order_amount, price_adjustment=price_adjustment, shipping_fee=shipping_fee)"

  no_promotion: &no_promotion
    name: 无促销
    compute: "not promotion_name"

  rows_name_match: &rows_name_match
    name: rows对拍-姓名一致
    compute: "customer_name_rows_cached == customer_name_rows_nocache"

  rows_level_match: &rows_level_match
    name: rows对拍-等级一致
    compute: "customer_level_rows_cached == customer_level_rows_nocache"

# ==============================================================================
# 输出配置(composed outputs)
# ==============================================================================

resources:
  books:
    report:
      $import: fragments.report_book
      path: ./.tmp/output/ecommerce_report.xlsx

# NOTE: meta/audit extra sheets were moved out of YAML mainline (output extras boundary).
# Configure via runtime entrypoints, e.g.:
#   overrides=RunOverrides(output_extras=OutputExtrasOverride(meta=True, audit=True))

outputs:
  - name: detail
    to: &report_to
      book: report
      sheet: 订单明细
    fields:
      - *detail_fields

  - name: no_promo
    to:
      <<: *report_to
      sheet: 无促销明细
    fields: *detail_fields
    where: "no_promotion"

  - name: by_region
    to:
      <<: *report_to
      sheet: 区域汇总
    aggregate:
      group_by: [region_name_display]
      fields:
        order_cnt: {count: {}}
        sum_order_amount: {sum: {field: order_amount}}
        customer_cnt: {count_distinct: {field: customer_id}}

  # ==============================================================================
  # 派生汇总输出(aggregate)示例: where/算子/guardrails/rank/top_k/多字段 group_by
  # ==============================================================================

  - name: by_region_no_promo
    to:
      <<: *report_to
      sheet: 区域汇总-无促销
    where: "no_promotion"
    aggregate:
      group_by: [region_name_display]
      fields:
        order_cnt: {count: {}}
        sum_order_amount: {sum: {field: order_amount}}
        customer_cnt: {count_distinct: {field: customer_id}}

  - name: by_region_ops
    to:
      <<: *report_to
      sheet: 区域汇总-算子
    aggregate:
      group_by: [region_name_display]
      # guardrails 示例(设为 0 表示不限制)
      max_groups: 1000
      max_distinct: 10000
      distinct_on_overflow: truncate
      fields:
        order_cnt: {count: {}}
        order_cnt_has_promo: {count: {field: promotion_id}}
        sum_order_amount: {sum: {field: order_amount}}
        min_order_amount: {min: {field: order_amount}}
        max_order_amount: {max: {field: order_amount}}
        no_promo_cnt: {count_true: {field: no_promotion}}
        big_order_cnt: {count_true_gte: {field: order_amount, threshold: 1000}}
        customer_cnt: {count_distinct: {field: customer_id}}
        customer_product_cnt: {count_distinct: {fields: [customer_id, product_id]}}

  - name: by_region_import
    to:
      <<: *report_to
      sheet: 区域汇总-模板
    aggregate:
      <<: *agg_by_region_guardrails
      fields:
        order_cnt: *metric_order_cnt
        sum_order_amount: *metric_sum_order_amount
        customer_cnt: {count_distinct: {field: customer_id}}

  - name: by_region_top_amount
    to:
      <<: *report_to
      sheet: 区域Top-金额
    aggregate:
      group_by: [region_name_display]
      fields:
        order_cnt: {count: {}}
        sum_order_amount: {sum: {field: order_amount}}
        rank:
          dense_rank:
            by: sum_order_amount
            order: desc
            top_k: 5
            top_k_mode: rank

  - name: by_region_category
    to:
      <<: *report_to
      sheet: 区域x分类
    aggregate:
      group_by: [region_name_display, category_name]
      fields:
        order_cnt: {count: {}}
        sum_order_amount: {sum: {field: order_amount}}
        customer_cnt: {count_distinct: {field: customer_id}}

# ==============================================================================
# 可观测性(Observability)
# ==============================================================================

# 注意:
# - YAML 主线已不再支持 `observability.*`(legacy key 会 warning + ignore).
# - 请在 Python/CLI runtime entrypoints 配置观测:
#   - `components=[PerformanceObserver(...), RelationObserver(...), ...]`
#   - `overrides=RunOverrides(viz_config=VizObserverConfig(...))`
# endregion
