# yaml-language-server: $schema=../../../../../src/scalim/dsl/yaml_dsl/schema/workflow.gen.json

workflow:
  resources:
    books:
      shared_report_sheet:
        xlsx:
          path: ./out/shared_report_sheet
          allow_formulas: false

      shared_report_append:
        xlsx:
          path: ./out/shared_report_append
          allow_formulas: false

      # 历史 sheetbook+export 形状；统一后与有 path 的 xlsx 同为落盘书（仍保留 book id 便于对拍）
      sheetbook_report_sheet:
        xlsx:
          path: ./out/sheetbook_report_sheet
          allow_formulas: false

      sheetbook_report_append:
        xlsx:
          path: ./out/sheetbook_report_append
          allow_formulas: false

  runs:
    - id: detail_a
      demand: workflow_demo_shared_workbooks_demand.yaml

    - id: detail_b
      demand: workflow_demo_shared_workbooks_demand.yaml
      depends_on: [detail_a]
