# yaml-language-server: $schema=../../../../../src/scalim/dsl/by_yaml/schema/workflow.gen.json

workflow:
  resources:
    books:
      shared_report:
        kind: xlsx_file
        path: ./shared_report.xlsx
        write_lock: true
        allow_formulas: false
        write_defaults:
          mode: append
          align_by: header
          header_policy: once
          on_mismatch: error
          on_conflict: overwrite

      sheetbook_report:
        kind: xlsx_memory
        budget:
          max_sheets: 6
          max_total_cells: 200000
        export_xlsx:
          path: ./sheetbook_report.xlsx
          write_lock: true
          allow_formulas: false
        write_defaults:
          mode: append
          align_by: header
          header_policy: once
          on_mismatch: error
          on_conflict: overwrite

  runs:
    - id: detail_a
      demand: workflow_demo_shared_workbooks_demand.yaml

    - id: detail_b
      demand: workflow_demo_shared_workbooks_demand.yaml
      depends_on: [detail_a]

  options:
    max_concurrency: 2
    failure_policy: all_fail
    cache_pool:
      conflict_policy: error
      release_policy: dag_refcount
      budget:
        max_entries: 16
        over_budget_policy: fail_fast
