# NOTE:
# This file is intended to be imported by `support_output_failure_*.yaml` via `imports/$import`.
# Imports v2 resolves paths relative to the current YAML file's directory.

base_main:
  main_source:
    source_id: tickets
    loader: "scalim_misc.demo_big_data_report.by_yaml_dsl.support_scenario:load_support_tickets"
    fields:
      ticket_id: {extract: ticket_id, name: 工单ID}
      priority: {extract: priority, name: 优先级}
      resolve_minutes: {extract: resolve_minutes, name: 解决耗时(分钟)}

base_resources:
  resources:
    files:
      detail_csv:
        csv_file:
          path: {$init_var: out_path_detail}
    books:
      secondary_debug:
        xlsx:
          path: {$init_var: out_path_secondary_workbook}
          allow_formulas: false
