# yaml-language-server: $schema=../../../../../src/scalim/dsl/yaml_dsl/schema/demand.gen.json
# 最小可跑需求（README 第一口 · ecommerce 主线的两源切片）：
# 主源 orders + 维表 payments 单级关联 + 一个派生字段 + 一个 csv 输出。

name: min_report
description: |
  最小电商订单报表: 订单 -> 支付方式(单级关联) + 派生字段 总金额

main_source:
  source_id: orders
  loader: scalim_misc.demo_big_data_report.min_loaders:load_orders
  fields:
    order_id:
      name: 订单ID
    amount:
      name: 金额
    pay_id:
      name: 支付ID

sources:
  payments:
    loader: scalim_misc.demo_big_data_report.min_loaders:load_payments
    key: id
    params:
      ids: {$keys: {as: set}}
    fields:
      method:
        name: 支付方式
        extract: payment_method
        relation: orders_to_payments

relations:
  orders_to_payments:
    steps:
      - from: orders.pay_id
        to: payments.id

fields:
  total_amount:
    name: 总金额
    compute: "amount * 2"

outputs:
  - name: detail
    to: {file: detail_csv}
    write: {header_fields_output_by: name}
    fields: [order_id, method, total_amount]

resources:
  files:
    detail_csv:
      csv_file:
        path: ./output
