# yaml-language-server: $schema=../../../../src/scalim/dsl/by_yaml/schema/demand.gen.json

name: demo_big_data_report_workflow_metrics_csv
description: |
  demo_big_data_report workflow demo: metrics output.

  目标:
  - 演示 `depends_on` + `scalim.workflow.loaders.sheetbook_sheet_rows` 从 workflow 共享 `sheetbook` 读取上游明细 rows
  - 演示 workflow `writes` 的 CSV aggregate 输出
  - 复用 `preload_counter` source,验证 workflow cache_pool 的 hit/release/evict 事件

batch_size: 30

main_source:
  source_id: detail_rows
  loader: "scalim.workflow.loaders:book_sheet_rows"
  params:
    ref:
      node: detail
      book: report
      sheet: Detail
  fields:
    region_name_display: {name: 区域名称(展示)}
    order_amount: {name: 订单金额, value_cast: decimal}

sources:
  preload_counter:
    loader: "scalim_misc.demo_big_data_report.loaders:load_workflow_preload_counter_table"
    key: id
    cache_mode: preload_forever

outputs_defaults:
  to:
    book: report

outputs:
  - name: metrics
    to:
      sheet: Metrics
    aggregate: &metrics_agg
      group_by: [region_name_display]
      fields:
        order_cnt: {count: {}}
        sum_order_amount: {sum: {field: order_amount}}

  - name: metrics_csv
    container:
      type: csv
      path: ./metrics.csv
      header_fields_output_by: field_id
      include_header: true
      streaming: true
    aggregate: *metrics_agg
