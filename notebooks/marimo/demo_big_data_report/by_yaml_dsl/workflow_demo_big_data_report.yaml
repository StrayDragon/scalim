# yaml-language-server: $schema=../../../../src/scalim/dsl/by_yaml/schema/workflow.gen.json

workflow:
  resources:
    sheetbooks:
      report:
        budget:
          max_sheets: 8
          max_total_cells: 200000
        export_xlsx:
          path: ./report.xlsx
          write_lock: true
    csvs:
      detail:
        path: ./detail.csv
      metrics:
        path: ./metrics.csv

  runs:
    - id: detail
      demand: "@/notebooks/marimo/demo_big_data_report/by_yaml_dsl/workflow_demo_big_data_report_detail_demand.yaml"
      writes:
        - sheetbook_sheet:
            sheetbook: report
            sheet: Detail
            output: detail
            on_conflict: error
        - csv_append:
            csv: detail
            output: detail
            header_policy: once
            on_mismatch: error

    - id: metrics
      demand: "@/notebooks/marimo/demo_big_data_report/by_yaml_dsl/workflow_demo_big_data_report_metrics_demand.yaml"
      depends_on: [detail]
      init_vars:
        detail_csv_path: {$ctx: {node: detail, key: output_path}}
      writes:
        - sheetbook_sheet:
            sheetbook: report
            sheet: Metrics
            output: metrics
            on_conflict: error
        - csv_append:
            csv: metrics
            output: metrics
            header_policy: once
            on_mismatch: error

  options:
    max_concurrency: 2
    failure_policy: all_fail
    ctx:
      max_value_bytes: 65536
      max_bytes: 1048576
    cache_pool:
      conflict_policy: error
      release_policy: dag_refcount
      budget:
        max_entries: 16
        over_budget_policy: fail_fast

