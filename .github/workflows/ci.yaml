name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            frontend/scalim-yaml-dsl-editor/pnpm-lock.yaml
            frontend/scalim-viz/pnpm-lock.yaml

      - name: Set up justfile
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Check
        run: just check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: .tmp/artifacts/
          if-no-files-found: warn

  py36-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Python 3.6 语法兼容性检查 (仅 `src/scalim/`)
        run: just py36-compat-check
