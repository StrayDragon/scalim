name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Check
        run: just check-only-py

      - name: Build and verify distribution
        run: just dist-check

      - name: Publish to PyPI (Trusted Publisher)
        run: uv publish
