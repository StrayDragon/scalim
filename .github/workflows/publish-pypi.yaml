name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Activate virtual env
        run: source .venv/bin/activate

      - name: Check
        run: just check-only-py

      - name: Build and verify distribution
        run: just dist-check

      - name: Build workspace distributions (tools)
        run: |
          uv --preview-features extra-build-dependencies build --package scalim-cli --wheel --sdist --no-create-gitignore --no-sources
          uv --preview-features extra-build-dependencies build --package scalim-yaml-dsl-lsp --wheel --sdist --no-create-gitignore --no-sources

      - name: Verify workspace distributions (tools)
        run: |
          uv --preview-features extra-build-dependencies run python scripts/check-build-artifacts.py --wheel dist/scalim_cli-*.whl --sdist dist/scalim_cli-*.tar.gz
          uv --preview-features extra-build-dependencies run python scripts/check-build-artifacts.py --wheel dist/scalim_yaml_dsl_lsp-*.whl --sdist dist/scalim_yaml_dsl_lsp-*.tar.gz

      - name: Publish to PyPI (Trusted Publisher)
        run: uv publish --check-url https://pypi.org/simple
