[project]
name = "scalim-yaml-dsl-lsp"
version = "0.9.0"
description = "YAML DSL editor semantics core for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [{ name = "straydragon", email = "straydragonl@foxmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "scalim",
    "pygls>=2.1.1",
]

[project.scripts]
scalim-yaml-dsl-lsp = "scalim_yaml_dsl_lsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.basedpyright]
# NOTE: keep vendored `src/scalim/vendor/yamlx/ruamel` pristine.
#
# `scalim.vendor.yamlx.ruamel.yaml` is a vendored copy of `ruamel.yaml`, and its `__init__.py`
# relies on absolute imports like `from ruamel.yaml.main import *` plus runtime `sys.modules`
# aliasing to stay self-contained.
#
# Static type-check cannot execute the aliasing, so we add `extraPaths` to help `basedpyright`
# resolve `ruamel.*` imports to the vendored tree during analysis.
extraPaths = ["../../src/scalim/vendor/yamlx"]
pythonVersion = "3.10"
pythonPlatform = "Linux"

# Keep warnings focused on actionable issues for this package (align with repo-root policy).
reportDeprecated = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedFunction = false
reportUnknownVariableType = false
