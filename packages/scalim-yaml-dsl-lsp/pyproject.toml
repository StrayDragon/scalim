[project]
name = "scalim-yaml-dsl-lsp"
version = "0.7.2"
description = "YAML DSL editor semantics core for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "scalim-dev" },
]

dependencies = [
    "scalim",
]

[project.scripts]
scalim-yaml-dsl-lsp = "scalim_yaml_dsl_lsp.cli:main"

[project.optional-dependencies]
server = [
    "pygls>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
