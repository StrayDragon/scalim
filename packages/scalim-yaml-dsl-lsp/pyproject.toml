[project]
name = "scalim-yaml-dsl-lsp"
version = "0.20.1"
description = "YAML DSL editor semantics core for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [{ name = "straydragon", email = "straydragonl@foxmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "scalim",
    "pygls>=2.1.1",
    # 直接 import `ruamel.yaml`(server/cursor_extraction) 与 `yaml`(core, schema 文档解析)
    "ruamel.yaml>=0.19.1",
    "pyyaml>=6.0.1",
]

[project.scripts]
scalim-yaml-dsl-lsp = "scalim_yaml_dsl_lsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"

# Keep warnings focused on actionable issues for this package (align with repo-root policy).
reportDeprecated = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedFunction = false
reportUnknownVariableType = false
