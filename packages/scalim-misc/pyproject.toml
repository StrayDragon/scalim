[project]
name = "scalim-misc"
version = "0.10.3"
description = "Misc utilities and examples for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "scalim-dev" },
]

dependencies = [
    "scalim",
    "scalim-cli",
    "pandas>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
