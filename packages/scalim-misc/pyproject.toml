[project]
name = "scalim-misc"
version = "0.9.14"
description = "Misc utilities and examples for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "scalim-dev" },
]

dependencies = [
    "scalim",
    "scalim-cli",
    # pandas: 1.1.5 是最后支持 3.6 的版本, 1.2.0+ 需要 >=3.7.1
    "pandas>=1.0.0,<1.2;python_version<'3.7'",
    "pandas>=2.0.3;python_version>='3.7'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
