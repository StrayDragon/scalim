[project]
name = "scalim-cli"
version = "0.8.3"
description = "Command-line tools for scalim"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "scalim-dev" },
]

dependencies = [
    "scalim",
    "jsonschema>=4.0.0",
]

[project.scripts]
scalim-cli = "scalim_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
